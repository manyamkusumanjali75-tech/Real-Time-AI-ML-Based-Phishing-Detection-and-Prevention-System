
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Phishing Detection System</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
    rgba(2,6,23,0.90),
    rgba(15,23,42,0.95)),
    url('{{ url_for("static",filename="inp2.jpg") }}');

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    overflow:hidden;
}

/* Animated Glow Background */

body::before{

    content:'';

    position:absolute;

    width:500px;
    height:500px;

    background:#00e5ff;

    border-radius:50%;

    filter:blur(180px);

    opacity:.15;

    top:-150px;
    left:-150px;

    animation:move1 8s infinite alternate;
}

body::after{

    content:'';

    position:absolute;

    width:500px;
    height:500px;

    background:#00ff95;

    border-radius:50%;

    filter:blur(180px);

    opacity:.12;

    bottom:-150px;
    right:-150px;

    animation:move2 8s infinite alternate;
}

@keyframes move1{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(120px,80px);
    }
}

@keyframes move2{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(-120px,-80px);
    }
}

.form-container{

    position:relative;
    z-index:10;

    width:95%;
    max-width:550px;
}

.form-box{

    background:rgba(255,255,255,0.08);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:30px;

    padding:45px;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.45);
}

.logo{

    text-align:center;

    font-size:60px;

    margin-bottom:10px;
}

h1{

    text-align:center;

    font-size:2.3rem;

    font-weight:700;

    background:
    linear-gradient(
    90deg,
    #00e5ff,
    #00ff95);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    margin-bottom:10px;
}

.subtitle{

    text-align:center;

    color:#d7d7d7;

    margin-bottom:30px;

    font-size:16px;
}

.input-group{

    margin-bottom:22px;
}

label{

    display:block;

    color:#00ff95;

    margin-bottom:8px;

    font-size:15px;

    font-weight:500;
}

input,
select{

    width:100%;

    padding:15px;

    border-radius:15px;

    border:1px solid rgba(255,255,255,0.15);

    outline:none;

    background:rgba(255,255,255,0.08);

    color:white;

    font-size:16px;

    transition:.3s;
}

input::placeholder{
    color:#cccccc;
}

input:focus,
select:focus{

    border-color:#00e5ff;

    box-shadow:
    0 0 15px rgba(0,229,255,0.3);
}

select option{

    background:#0f172a;
    color:white;
}

.floating-home {
    position: absolute;
    top: 25px;
    left: 30px;
    padding: 12px 22px;
    background: rgba(15, 23, 42, 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 229, 255, 0.3);
    border-radius: 50px;
    color: #00e5ff;
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
    z-index: 100;
}

.floating-home:hover {
    transform: translateY(-3px);
    background: #00e5ff;
    color: #0f172a;
    box-shadow: 0 15px 30px rgba(0, 229, 255, 0.4);
}

.action-buttons {
    display: flex;
    gap: 15px;
    margin-top: 5px;
}

.detect-btn {
    flex: 2;
    padding: 16px;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    color: white;
    cursor: pointer;
    background: linear-gradient(135deg, #00e5ff, #0066ff);
    transition: .4s;
}

.detect-btn:hover {
    transform: translateY(-4px);
    background: linear-gradient(135deg, #00ff95, #00e5ff);
    box-shadow: 0 12px 30px rgba(0, 229, 255, 0.35);
}

.home-btn {
    flex: 1;
    padding: 16px;
    border: 1px solid #00e5ff;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    color: #00e5ff;
    background: rgba(15, 23, 42, 0.8);
    cursor: pointer;
    transition: .4s;
}

.home-btn:hover {
    background: #00e5ff;
    color: #0f172a;
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0, 229, 255, 0.35);
}

.features{

    display:flex;

    justify-content:space-between;

    margin-top:25px;

    text-align:center;
}

.feature{

    flex:1;

    color:#dcdcdc;

    font-size:13px;
}

.feature span{

    display:block;

    font-size:24px;

    margin-bottom:5px;
}

.footer{

    margin-top:25px;

    text-align:center;

    color:#bdbdbd;

    font-size:14px;
}

@media(max-width:768px){

.form-box{
    padding:30px;
}

h1{
    font-size:1.8rem;
}

.features{
    flex-direction:column;
    gap:15px;
}

}

</style>

</head>

<body>

<a href="/" class="floating-home">🏠 Back to Home</a>

<div class="form-container">

<div class="form-box">

<div class="logo">
🛡️
</div>

<h1>
AI Phishing Detection
</h1>

<p class="subtitle">
Real-Time AI/ML-Based Phishing Detection & Prevention System
</p>

<form action="/predict" method="POST">

<div class="input-group">

<label>🌐 Website URL</label>

<input
type="text"
name="url"
placeholder="Enter Website URL"
required>

</div>

<div class="input-group">

<label>🔒 Protocol Type</label>

<select name="protocol">

<option value="http">HTTP</option>

<option value="https">HTTPS</option>

<option value="ftp">FTP</option>

<option value="sftp">SFTP</option>

</select>

</div>

<div class="action-buttons">
    <button type="submit" class="detect-btn">
        🚀 Analyze & Detect Threat
    </button>
</div>

</form>

<div class="features">

<div class="feature">
<span>⚡</span>
Real-Time
</div>

<div class="feature">
<span>🤖</span>
AI Powered
</div>

<div class="feature">
<span>🔐</span>
Secure
</div>

</div>

<div class="footer">

Cybersecurity Protection Using Artificial Intelligence &
Machine Learning

</div>

</div>

</div>

</body>
</html>
